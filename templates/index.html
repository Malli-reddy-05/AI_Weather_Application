<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherWise | AI Weather Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">LIVE WEATHER · AI INSIGHTS</p>
        <h1>Weather, made<br /><em>human.</em></h1>
        <p class="intro">Search any city for live conditions and a simple note to help you plan your day.</p>
        <form id="search-form" class="search" novalidate>
          <label class="sr-only" for="city">City name</label>
          <input id="city" name="city" type="text" placeholder="Search a city..." autocomplete="off" required />
          <button type="submit">Check weather <span>→</span></button>
        </form>
        <p id="error" class="error" role="alert"></p>
      </section>

      <section id="weather-card" class="weather-card hidden" aria-live="polite">
        <div class="place-row"><p id="place"></p><p id="condition" class="condition"></p></div>
        <div class="temperature-row">
          <img id="weather-icon" alt="" />
          <p><strong id="temperature"></strong><span>°C</span></p>
        </div>
        <p id="description" class="description"></p>
        <div class="details">
          <div><span>Feels like</span><strong id="feels-like"></strong></div>
          <div><span>Humidity</span><strong id="humidity"></strong></div>
          <div><span>Wind</span><strong id="wind"></strong></div>
        </div>
        <div class="ai-note"><span>✦</span><p id="summary"></p></div>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
